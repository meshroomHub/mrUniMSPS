[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-uni-ms-ps"
version = "2.0.0"
description = "Meshroom plugin for Uni-MS-PS universal photometric stereo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil",
    "uni-ms-ps @ git+https://github.com/meshroomHubWarehouse/Uni-MS-PS.git@meshroom",
]

# Meshroom discovers the node from MESHROOM_PLUGINS_PATH, not site-packages.
# This distribution installs the plugin's dependencies into its venv.
[tool.setuptools]
packages = []
